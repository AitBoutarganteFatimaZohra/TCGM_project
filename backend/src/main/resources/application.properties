# =============================================================
# APPLICATION PROPERTIES - Configuration Principale
# =============================================================

# =============================================================
# PROFIL ACTIF
# =============================================================
# Décommentez la ligne ci-dessous pour activer un profil spécifique
# spring.profiles.active=dev
spring.profiles.active=mysql

# =============================================================
# SERVEUR
# =============================================================
server.port=8081
server.servlet.context-path=/
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

# =============================================================
# SPRING BOOT
# =============================================================
spring.application.name=tcgm-backend

# =============================================================
# JACKSON (Format JSON)
# =============================================================
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# =============================================================
# LOGGING
# =============================================================
logging.level.root=INFO
logging.level.com.tcgm=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

# =============================================================
# JWT (JSON Web Token)
# =============================================================
app.jwt.secret=tcgmProjectSecretKey2024WithMoreThan32CharactersForSecurity
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# =============================================================
# SPRING DOC (Swagger/OpenAPI)
# =============================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.show-actuator=true

# =============================================================
# FILE UPLOADS
# =============================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB