# =============================================================
# APPLICATION DEV PROPERTIES - Profil Développement
# =============================================================
# Utilisez ce profil pour le développement avec H2 en mémoire
# spring.profiles.active=dev

# =============================================================
# BASE DE DONNÉES H2 (en mémoire)
# =============================================================
spring.datasource.url=jdbc:h2:mem:tcgm_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# =============================================================
# H2 CONSOLE
# =============================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false

# =============================================================
# JPA / HIBERNATE
# =============================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.defer-datasource-initialization=true

# =============================================================
# LOGGING (Dev)
# =============================================================
logging.level.com.tcgm=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE