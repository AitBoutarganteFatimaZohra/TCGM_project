# =============================================================
# APPLICATION MYSQL PROPERTIES - Profil MySQL
# =============================================================
# Utilisez ce profil pour MySQL en production
# spring.profiles.active=mysql

# =============================================================
# BASE DE DONNÉES MySQL
# =============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/tcgm_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password= 

# =============================================================
# HIKARI CP (Connection Pool)
# =============================================================
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# =============================================================
# JPA / HIBERNATE
# =============================================================
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# =============================================================
# FLYWAY (Migrations)
# =============================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
spring.flyway.validate-on-migrate=true

# =============================================================
# LOGGING (Prod)
# =============================================================
logging.level.com.tcgm=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN